[package]
name = "photos-ml"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "tracing", "api-22", "directml"] }
photos-core = { version = "0.1.0", path = "../core" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
