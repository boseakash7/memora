[package]
name = "photos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "parallel"] }
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dirs = "7.0.0"
dunce = "1.0.5"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
jpeg-decoder = "0.3.2"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
kamadak-exif = "0.6.1"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
rayon = "1.12.0"
reverse_geocoder = "4.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
trash = "5.2.9"
tzf-rs = { version = "2.3.0", default-features = false, features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
