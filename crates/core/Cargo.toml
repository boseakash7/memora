[package]
name = "photos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
dunce = "1.0.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
jpeg-decoder = "0.3.2"
kamadak-exif = "0.6.1"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
rayon = "1.12.0"
reverse_geocoder = "4.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
trash = "5.2.9"
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
